name: add-optimized-images
on:
  push:
    branches: [fix/stacknoord-nl-live]
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode image payloads
        run: |
          python3 << 'PY'
          import base64, pathlib, sys
          root = pathlib.Path('.')
          mapping = {
              'tmp-images/tjimka.webp.b64': 'assets/tjimka.webp',
          }
          found = {src: dest for src, dest in mapping.items() if (root / src).is_file()}
          if not found:
              print('No payload files left, nothing to do.')
              sys.exit(0)
          for src, dest in found.items():
              data = base64.b64decode((root / src).read_text())
              dest_path = root / dest
              dest_path.parent.mkdir(parents=True, exist_ok=True)
              dest_path.write_bytes(data)
              print(f'Wrote {dest} ({len(data)} bytes)')
          tmp = root / 'tmp-images'
          if tmp.exists():
              for f in tmp.iterdir():
                  f.unlink()
              tmp.rmdir()
              print('Removed tmp-images/')
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Trek Tjimka's profielfoto in dezelfde verhouding als die van Harrie en Robin."
          git push
